    keyword: additionalProperties,
    property: burst,
    patch: [{ op: add, path: /traffic/schedule/0/burst, value: 3 }],
  }
- {
    name: unknown-field-in-edit,
    differs: "sdlab does not check unknown fields in edits",
    schema: invalid,
    at: /reference_solution/0,
    keyword: additionalProperties,
    property: unit,
    patch: [{ op: add, path: /reference_solution/0/unit, value: pct }],
  }
