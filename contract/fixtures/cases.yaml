# Conformance cases for contract/lab-spec.schema.json. Each case is a change to the base lab
# (fixtures/valid/caching-basics.yaml) written as RFC 6902-style operations (remove, replace, add; "-" appends to a list).
# A test applies the patch, validates, and compares the verdict.
#
#   schema:   valid | invalid     verdict of the JSON Schema (structure)
#   at:       JSON pointer of the first problem the schema reports (invalid cases)
#   keyword:  the failing JSON Schema keyword
#   property: the missing or unexpected property name (required / additionalProperties)
#   sdlab:    for `schema: valid` cases that sdlab's scripts/validate.py still rejects: the rule it applies. These are
#             validator rules that JSON Schema cannot express (cross-field, ordering, references, anti-leak); see RULES.md.
#   differs:  the schema is stricter than sdlab's validator today (sdlab accepts it); sdlab should tighten when vendoring.
#
# Cases marked `from` come from sdlab tests/test_labs.py (same mutation), so the two repos can be compared.

# ---------------------------------------------------------------- valid variants
- name: base
  schema: valid
- name: case-and-play-fields
  differs: "new fields from S-103: sdlab's validator does not know `case` and `play` yet; it must accept them before contract 0.1.0"
  schema: valid
  patch:
    - {
        op: add,
        path: /case,
        value:
          {
            story: "Toko online ramai jam 19.00.",
            symptom: "Halaman makin lambat.",
            timeline:
              [{ at_s: 120, caption: "Trafik naik." }, { at_s: 180, caption: "Database sibuk." }],
            observe: [db],
          },
      }
    - { op: add, path: /play, value: { speeds: [1, 10, 60], default_speed: 60 } }
- name: case-with-story-only
  differs: "new fields from S-103: sdlab's validator does not know `case` and `play` yet; it must accept them before contract 0.1.0"
  schema: valid
  patch: [{ op: add, path: /case, value: { story: "Cerita." } }]
- name: illustrative-with-note
  schema: valid
  patch:
    - { op: replace, path: /illustrative, value: true }
    - { op: add, path: /illustrative_note, value: "Angka ini ilustrasi." }
- name: secondary-concepts
  schema: valid
  patch: [{ op: add, path: /secondary_concepts, value: [connection-pooling] }]
- name: edges-as-mappings-with-policies
  from: LabTopology.test_edges_may_be_mappings
  schema: valid
  patch:
    - {
        op: replace,
        path: /topology/edges,
        value:
          [
            {
              from: users,
              to: app,
              policies: [timeout, { id: retry, params: { max_attempts: 3, backoff: exponential } }],
            },
            [app, cache],
            [app, db],
          ],
      }
- name: traffic-without-read-share
  schema: valid
  patch: [{ op: remove, path: /traffic/read_share }]
- name: diagnose-mode
  from: LabModes.test_diagnose_needs_a_scenario
  schema: valid
  patch:
    - { op: replace, path: /mode, value: diagnose }
    - {
        op: add,
        path: /scenarios,
        value:
          [
            { id: bad-deploy, at_s: 60 },
            { id: slow-dependency, at_s: 90, duration_s: 30, params: { added_latency_ms: 200 } },
          ],
      }
- name: build-mode
  from: LabModes.test_build_needs_a_palette
  schema: valid
  patch:
    - { op: replace, path: /mode, value: build }
    - { op: remove, path: /allowed_edits }
    - { op: add, path: /palette, value: [{ type: cache, max: 2 }, { type: load-balancer, max: 1 }] }
- name: brute-force-waiver-instead-of-entry
  from: LabSolutions.test_brute_force_entry_or_waiver
  schema: valid
  patch:
    - { op: remove, path: /wrong_answers/1/brute_force }
    - { op: add, path: /brute_force_ok, value: "Tiap nilai ekstrem berbahaya." }
- name: all-predicates-with-valid-args
  schema: valid
  patch:
    - op: replace
      path: /structural_rules
      value:
        - {
            id: r1,
            predicate: has-node,
            args: { type: cache, min: 1 },
            feedback_pass: ok,
            feedback_fail: gagal,
          }
        - {
            id: r2,
            predicate: has-edge,
            args: { from: app, to: cache },
            feedback_pass: ok,
            feedback_fail: gagal,
          }
        - {
            id: r3,
            predicate: node-between,
            args: { node: cache, from: app, to: db },
            feedback_pass: ok,
            feedback_fail: gagal,
          }
        - {
            id: r4,
            predicate: param-unchanged,
            args: { node: db, param: pool },
            feedback_pass: ok,
            feedback_fail: gagal,
          }
        - {
            id: r5,
            predicate: param-range,
            args: { node: cache, param: capacity_pct, min: 0 },
            feedback_pass: ok,
            feedback_fail: gagal,
          }
        - {
            id: r6,
            predicate: count-le,
            args: { type: cache, max: 2 },
            feedback_pass: ok,
            feedback_fail: gagal,
          }
        - {
            id: r7,
            predicate: policy-present,
            args: { from: users, to: app, policy: timeout },
            feedback_pass: ok,
            feedback_fail: gagal,
          }
        - {
            id: r8,
            predicate: no-spof,
            args: { type: db },
            feedback_pass: ok,
            feedback_fail: gagal,
          }
- name: no-structural-rules
  schema: valid
  patch: [{ op: remove, path: /structural_rules }]
- name: latency-target-paired-with-error-rate
  from: LabGrading.test_latency_target_needs_an_error_or_goodput_target
  schema: valid
  patch:
    - {
        op: add,
        path: /targets/-,
        value:
          {
            id: p99,
            metric: latency_p99_ms,
            node: users,
            window: { from_s: 180, to_s: 600 },
            aggregate: p99,
            op: "<=",
            value: 500,
            feedback_pass: ok,
            feedback_fail: gagal,
          },
      }
- name: duration-outside-the-target-range-is-only-a-warning
  from: LabBasics.test_duration_warns_outside_target
  schema: valid
  patch: [{ op: replace, path: /duration_min, value: 45 }]
- name: tier-3-hint-may-name-a-value
  from: LabAntiLeak.test_tier_1_and_2_hints_must_not_contain_values_but_tier_3_may_name_mechanism
  schema: valid
  patch: [{ op: replace, path: /hints/2/text, value: "TTL 300 cukup lama." }]

