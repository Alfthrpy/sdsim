    keyword: minimum,
    patch: [{ op: replace, path: /traffic/schedule/0/at_s, value: -5 }],
  }
- {
    name: negative-window-start,
    differs: "sdlab accepts a negative from_s",
    schema: invalid,
    at: /targets/0/window/from_s,
    keyword: minimum,
    patch: [{ op: replace, path: /targets/0/window/from_s, value: -1 }],
  }
- {
    name: node-type-not-kebab,
    differs: "sdlab does not check the shape of node types",
    schema: invalid,
    at: /topology/nodes/1/type,
    keyword: pattern,
    patch: [{ op: replace, path: /topology/nodes/1/type, value: ApiServer }],
  }
- {
    name: concept-id-not-kebab,
    differs: "sdlab checks the concept against concepts.yaml, not its shape",
    schema: invalid,
    at: /concept,
    keyword: pattern,
    patch: [{ op: replace, path: /concept, value: Caching_Basics }],
  }
- {
    name: palette-item-without-max,
    differs: "sdlab checks only the type of a palette item",
    schema: invalid,
    at: /palette/0,
    keyword: required,
    property: max,
    patch:
      [
        { op: replace, path: /mode, value: build },
        { op: remove, path: /allowed_edits },
        { op: add, path: /palette, value: [{ type: cache }] },
      ],
  }
- {
    name: palette-max-zero,
    differs: "sdlab checks only the type of a palette item",
    schema: invalid,
    at: /palette/0/max,
    keyword: minimum,
    patch:
      [
        { op: replace, path: /mode, value: build },
        { op: remove, path: /allowed_edits },
        { op: add, path: /palette, value: [{ type: cache, max: 0 }] },
      ],
  }
- {
    name: empty-scenarios-in-tune-mode,
