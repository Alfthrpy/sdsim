name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate tickets
        run: python scripts/validate.py
      - name: Ticket tooling tests
        run: python -m unittest discover tests
      - name: BOARD.md is up to date
        run: python scripts/board.py --check
      # Code checks (build, lint, unit and oracle tests) are added by the bootstrap ticket; see docs/PLAN.md.
